name: grants_browser
description: >
  Federal funding opportunities from simpler.grants.gov. Result rows are
  rendered client-side, so this target is the browser path.
start_url: https://simpler.grants.gov/search
fetcher: browser
fetcher_reason: >
  The server response for /search contains no result rows; a plain GET returns
  the Next.js shell only. The rows appear after client-side hydration, so a
  real browser is required rather than preferred.
respect_robots: true
rate_per_second: 0.5
wait_for_selector: "table tbody tr"
pagination:
  kind: query_param
  param: page
  start: 1
  step: 1
extraction:
  row_selector: "table tbody tr"
  fields:
    close_date: "td:nth-child(1) .flex-2"
    status: "td:nth-child(2) .flex-2"
    title: "td:nth-child(3) .flex-2"
    agency: "td:nth-child(4) .flex-2"
    award_min: "td:nth-child(5) .flex-2"
    award_max: "td:nth-child(6) .flex-2"
  attributes:
    detail_url: "td:nth-child(3) a@href"
  row_key: ["detail_url"]
api_alternative: https://api.grants.gov/v1/api/search2
