name: grants_api
description: >
  The same opportunity data from the public JSON API, kept beside the browser
  target so the README can compare the two paths honestly: when an API exists,
  it is the cheaper and more stable choice.
start_url: https://api.grants.gov/v1/api/search2
fetcher: http
fetcher_reason: Public JSON endpoint; no rendering required.
respect_robots: true
rate_per_second: 2.0
method: POST
pagination:
  kind: offset
  param: startRecordNum
  start: 0
  step: 25
extraction:
  row_selector: "data.oppHits"
  fields:
    opportunity_number: "number"
    title: "title"
    agency: "agencyCode"
    posted_date: "openDate"
    close_date: "closeDate"
  row_key: ["opportunity_number"]
params:
  rows: 25
  keyword: ""
  oppStatuses: "posted"
