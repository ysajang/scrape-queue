[project]
name = "scrape-queue"
version = "0.1.0"
description = "Queued scraping service: FastAPI control plane, Celery workers, Playwright when rendering is required."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ysajang" }]
dependencies = [
    "scrape-kit @ git+https://github.com/ysajang/scrape-kit@c85776de7f665518c369758c0f416e341797dc95",
    "celery[redis]>=5.6,<6",
    "celery-redbeat>=2.4,<3",
    "redis>=5.0,<6.5",
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.52,<1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.19,<2",
    "psycopg[binary,pool]>=3.3,<4",
    "playwright>=1.62,<2",
    "httpx>=0.28,<1",
    "boto3>=1.43,<2",
    "PyYAML>=6.0,<7",
    "structlog>=26.1,<27",
    "prometheus-client>=0.26,<1",
    "opentelemetry-sdk>=1.44,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-celery>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "fakeredis[lua]>=2.37,<3",
    "testcontainers[postgres,minio]>=4.15,<5",
    "ruff>=0.16,<1",
    "mypy>=2.3,<3",
    "types-PyYAML",
    "types-boto3",
]
observability = ["flower>=2.1,<3"]

[project.scripts]
scrapequeue = "scrapequeue.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scrapequeue*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: needs redis/postgres/minio containers",
  "chaos: kills processes, run explicitly",
]
addopts = "-m 'not integration and not chaos'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "ASYNC"]
per-file-ignores = { "tests/*" = ["S101", "S105", "S106"] }

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "redbeat.*", "scrapekit.*", "testcontainers.*", "fakeredis.*"]
ignore_missing_imports = true
