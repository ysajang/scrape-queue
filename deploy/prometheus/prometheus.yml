global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: api
    static_configs: [{targets: ["api:8000"]}]
  - job_name: workers
    # Workers expose metrics on the port started by the worker_ready signal.
    static_configs:
      - targets: ["worker-default:9464", "worker-browser:9464"]
